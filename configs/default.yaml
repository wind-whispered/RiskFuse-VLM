  - 1.0
  under:
  - 0.0
  - 1.0
  on_top_of:
  - 0.0
  - -1.0
  left_of:
  - -1.0
  - 0.0
  right_of:
  - 1.0
  - 0.0
  in_front_of:
  - 0.0
  - 1.0
  behind:
  - 0.0
  - -1.0
